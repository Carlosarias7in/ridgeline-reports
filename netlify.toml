[build]
  command = "npm run build"
  publish = "dist"

# /for/company-name serves the report template. The slug is read client side.
[[redirects]]
  from = "/for/:slug"
  to = "/report.html"
  status = 200

[[redirects]]
  from = "/for/:slug/"
  to = "/report.html"
  status = 200

# Reports are private. Keep every page out of search indexes.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
